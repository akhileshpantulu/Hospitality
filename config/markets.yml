# European market universe.
#
# The `keys` block is the crosswalk that lets every source join to the same
# market spine. STR/CoStar market boundaries are the primary spine because
# lodging performance is the highest-value signal; other sources map onto it.
#
# STATUS: DRAFT UNIVERSE. Crosswalk keys are deliberately null. Populating them
# is sourcing Task 0 (see docs/sources/README.md) and must be done against the
# authoritative code lists, not from memory.
#
# tier:  1 = core institutional market, 2 = secondary, 3 = resort/seasonal
# demand_profile: drives which indicators get weighted for this market

meta:
  region: Europe
  spine: str_market
  status: draft
  review_required: true

