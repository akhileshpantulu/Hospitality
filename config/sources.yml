# Source registry.
#
# status:  proposed -> approved -> wired   (or rejected, with a reason)
# NOTHING here is ingested yet. Each source gets specced, decided on, and wired
# individually. See docs/sources/README.md for the working queue.
#
# refresh_interval_hours is what the scheduler honours. The pipeline ticks
# daily; a monthly series with interval 168 is checked weekly, not 30x/month.

meta:
  status: sourcing_in_progress
  ingested: none

sources:

  # ============ 1. LODGING PERFORMANCE (the spine) ============
  - id: str_destination
    name: STR Destination Report (Highgate Hotels Intl Ltd)
    provider: STR / CoStar
    category: demand_lodging
    access: email_attachment
    auth: null             # see docs/sources/str_destination_report.md, retrieval options A-D
    refresh_interval_hours: 720   # monthly; arrives ~17th-18th of following month
    geo_level: market
    coverage: UNKNOWN - subscription destination set, not all European markets
    license: restricted    # non-redistributable: indexed or YoY-delta form only
    cost: subscription (held)
    status: deferred       # see docs/backlog.md; spec complete, retrieval undecided
    indicators: [occupancy, adr, revpar, supply_roomnights, demand_roomnights]
    notes: >
      Primary spine. Sender destin@str.com, attachment
      HighgateHotelsIntlLtd_<YYYYMM>.xls. Binary attachments are not readable
      through the M365 connector and no copy exists in SharePoint or Box, so
      retrieval needs a decision. Monthly cadence means STR anchors the level
      but cannot drive the live layer. Destination set defines the market
      spine, so config/markets.yml must be reconciled to it.

  - id: str_pipeline
    name: STR construction pipeline
    provider: CoStar
    category: supply
    access: api
    auth: STR_API_KEY
    refresh_interval_hours: 168
    geo_level: market
    coverage: n/a
    license: restricted
    cost: NOT ENTITLED - buy decision required
    status: rejected
    indicators: [rooms_under_construction, rooms_final_planning, pipeline_pct_existing]
    notes: >
      NOT in the current entitlement (Destination Report only). Supply is one of
      the strongest medium-term headwind signals and currently has NO source.
      Alternatives: Lodging Econometrics (paid), STR Pipeline add-on (paid),
      Eurostat building permits (weak proxy), or manual tracking for tier-1
      markets only. Open decision, see docs/sources/str_destination_report.md s10.

  # ============ 2. AIR CONNECTIVITY ============
  - id: eurocontrol
    name: EUROCONTROL daily traffic
    provider: EUROCONTROL
    category: demand_air
    access: bulk_download
    auth: null
    refresh_interval_hours: 24
    geo_level: airport
    coverage: European airports; verify TR participation and small resort airports
    license: attribution
    cost: free
    status: approved_blocked   # approved in principle; mechanics need egress (ADR 0002)
    indicators: [daily_flights, flights_yoy, flights_yoy_7dma]
    notes: >
      Carries the live layer alone now that STR is deferred. Score the smoothed
      7-day series, not the daily print: day-of-week effects and single-day
      disruptions otherwise generate constant false signals. Joins on IATA but
      EUROCONTROL uses ICAO, so an IATA-ICAO mapping is needed. Join quality is
      poor for multi-airport markets and road-accessible resorts; those need a
      lower confidence value rather than exclusion.
      See docs/sources/eurocontrol.md.

  - id: oag
    name: OAG / Cirium schedules and seat capacity
    provider: OAG or Cirium
    category: demand_air
    access: api
    auth: OAG_API_KEY
    refresh_interval_hours: 168
    geo_level: airport
    coverage: Global, forward-looking schedules
    license: restricted
    cost: subscription (NOT held - decide)
    status: proposed
    indicators: [forward_seats, forward_seats_yoy, inbound_seats_by_origin]
    notes: >
      Forward seat capacity is the single best leading indicator of market
      demand 3-9 months out. Paid. Decide whether to buy or proxy.

  - id: eurostat_avia
    name: Eurostat air passenger transport
    provider: Eurostat
    category: demand_air
    access: api
    auth: null
    refresh_interval_hours: 168
    geo_level: airport
    coverage: EU/EEA airports and airport pairs, monthly, ~3 month lag
    license: attribution
    cost: free
    status: proposed
    indicators: [air_pax_monthly, air_pax_yoy, inbound_pax_by_origin, source_market_mix]
    notes: >
      avia_par_<cc> gives airport-to-airport route passengers, which yields a
      source-market mix per market. That mix is what makes FX weighting
      meaningful rather than decorative, so this now gates ecb_fx scoring.
      Complements rather than duplicates EUROCONTROL: EUROCONTROL counts flights
      today, this says where passengers actually came from. Also avia_paoc at
      country level. See docs/sources/eurostat.md.

  # ============ 3. TOURISM & VISITATION ============
  - id: eurostat_tour
    name: Eurostat tourism nights spent and arrivals
    provider: Eurostat
    category: tourism
    access: api          # production: ec.europa.eu. exploration: eurostat-mcp-server
    auth: null
    refresh_interval_hours: 168
    geo_level: nuts
    coverage: EU/EEA at NUTS2, monthly, 2-4 month lag; UK excluded post-Brexit
    license: attribution
    cost: free
    status: proposed
    indicators: [nights_spent, nights_spent_yoy, arrivals, length_of_stay, nights_foreign_share]
    notes: >
      PROMOTED. With STR deferred this is the closest public proxy to lodging
      demand, not merely a cross-check. Primary series tour_occ_nin2m (NUTS2,
      monthly). Covers ALL tourist accommodation, not branded hotels, so a
      market losing share to short-term rentals looks healthier here than STR
      would show. Must not be presented as an STR substitute.
      See docs/sources/eurostat.md.

  - id: unwto
    name: UN Tourism international arrivals
    provider: UN Tourism (UNWTO)
    category: tourism
    access: manual_upload
    auth: null
    refresh_interval_hours: 720
    geo_level: country
    coverage: Global, country-level, heavily lagged
    license: restricted
    cost: partly paid
    status: proposed
    indicators: [intl_arrivals, intl_receipts]
    notes: Low frequency. Context only, probably not scored.

  - id: national_stats
    name: National statistics offices (INE, ISTAT, ONS, Destatis, etc.)
    provider: various
    category: tourism
    access: api
    auth: null
    refresh_interval_hours: 168
    geo_level: nuts
    coverage: Country-by-country, inconsistent
    license: attribution
    cost: free
    status: proposed
    indicators: [hotel_nights_national, arrivals_national]
    notes: >
      Faster than Eurostat for the big markets (ES, IT, GB, DE) but each is a
      separate connector. High maintenance cost. Decide per country, not as a block.

  # ============ 4. GROUP & EVENT DEMAND ============
  - id: event_calendar
    name: Convention centre and major event calendars
    provider: various venues
    category: group
    access: scrape
    auth: null
    refresh_interval_hours: 168
    geo_level: market
    coverage: Manual per market
    license: public
    cost: free
    status: proposed
    indicators: [compression_nights, major_event_count]
    notes: >
      High signal value for tier-1 corporate markets, high maintenance cost.
      Likely worth it for only the top 10-15 markets.

  # ============ 5. MACRO ============
  - id: ecb_sdw
    name: ECB Data Portal
    provider: European Central Bank
    category: macro
    access: api
    auth: null
    refresh_interval_hours: 24
    geo_level: country
    coverage: Euro area and EU
    license: attribution
    cost: free
    status: proposed
    indicators: [policy_rate, hicp, consumer_confidence]

  - id: eurostat_macro
    name: Eurostat macro aggregates
    provider: Eurostat
    category: macro
    access: api
    auth: null
    refresh_interval_hours: 168
    geo_level: nuts
    coverage: EU/EEA, some series at NUTS2
    license: attribution
    cost: free
    status: proposed
    indicators: [gdp_growth, unemployment, real_wage_growth]

  - id: oecd
    name: OECD indicators
    provider: OECD
    category: macro
    access: api
    auth: null
    refresh_interval_hours: 168
    geo_level: country
    coverage: Incl. non-EU Europe (CH, GB, TR, NO, IS)
    license: attribution
    cost: free
    status: proposed
    indicators: [cli, business_confidence, gdp_growth]
    notes: Fills the gap where Eurostat stops (UK, Switzerland, Turkey, Norway).

  # ============ 6. FX ============
  - id: ecb_fx
    name: ECB daily reference rates
    provider: European Central Bank
    category: fx
    access: api
    auth: null
    refresh_interval_hours: 24
    geo_level: country
    coverage: EUR crosses, daily
    license: attribution
    cost: free
    status: proposed
    indicators: [fx_rate, fx_yoy, inbound_purchasing_power]
    notes: >
      Matters most for markets with a large non-euro source-market mix
      (USD into Southern Europe, GBP into Iberia, TRY effects in Istanbul).
      Requires a source-market mix weighting to be meaningful.

  # ============ 7. NEWS & SENTIMENT ============
  - id: gdelt
    name: GDELT global news graph
    provider: GDELT Project
    category: news
    access: api
    auth: null
    refresh_interval_hours: 24
    geo_level: market
    coverage: Global, 15-minute updates
    license: public
    cost: free
    status: proposed
    indicators: [news_volume, news_tone, event_flags]
    notes: >
      Free and genuinely live, but noisy. Needs a per-market query definition
      and tone baselining or it will produce false signals constantly.

  - id: news_api
    name: Curated trade and financial news feed
    provider: TBD
    category: news
    access: api
    auth: NEWS_API_KEY
    refresh_interval_hours: 24
    geo_level: market
    coverage: TBD
    license: restricted
    cost: TBD
    status: proposed
    indicators: [headline_digest]
    notes: For the narrative layer of the dashboard, not for scoring.

  # ============ 8. RISK & DISRUPTION ============
  - id: travel_advisories
    name: Government travel advisories
    provider: FCDO / US State Dept / Auswaertiges Amt
    category: risk
    access: api
    auth: null
    refresh_interval_hours: 24
    geo_level: country
    coverage: Global
    license: public
    cost: free
    status: proposed
    indicators: [advisory_level, advisory_change_flag]
    notes: A change in level is the signal, not the level itself.

  - id: disruption
    name: Strikes, closures, natural events
    provider: TBD
    category: risk
    access: scrape
    auth: null
    refresh_interval_hours: 24
    geo_level: market
    coverage: TBD
    license: public
    cost: free
    status: proposed
    indicators: [disruption_flag]
    notes: >
      European air traffic control and rail strikes are a recurring, material
      short-term headwind. No clean structured source exists. Needs design work.

  # ============ 9. COST BASE ============
  - id: eurostat_capacity
    name: Eurostat tourist accommodation capacity (supply proxy)
    provider: Eurostat
    category: supply
    access: api
    auth: null
    refresh_interval_hours: 720
    geo_level: nuts
    coverage: EU/EEA NUTS2 from 2012; UK excluded post-Brexit, CH/NO/IS/TR vary
    license: attribution
    cost: free
    status: proposed
    indicators: [bed_places, bed_places_yoy, supply_demand_balance]
    notes: >
      tour_cap_nuts2d. Primary supply measure, replacing building permits per
      ADR 0003. Pairs with tour_occ_nin2m on the same geography and source, so
      bed-place growth against nights-spent growth gives a real supply-demand
      balance. Annual, so it measures realised supply, not forward pipeline.
      Includes campsites and holiday dwellings, whose share varies hugely by
      market, so score the within-market time series only and never compare
      bed-place levels across markets. Confidence < 1.0.

  - id: construction_proxy
    name: Building permits and construction output
    provider: Eurostat / national statistics offices
    category: supply
    access: api
    auth: null
    refresh_interval_hours: 168
    geo_level: country
    coverage: EU/EEA; UK, CH, TR need separate handling
    license: attribution
    cost: free
    status: secondary
    indicators: [building_permits_index, construction_output_yoy]
    notes: >
      Demoted to a secondary directional hint per ADR 0003. Covers all building
      types, so it moves for reasons unrelated to lodging supply. Useful only as
      a hint about direction ahead of bed places, never as a level.

  - id: cost_inputs
    name: Labour, energy and insurance cost indices
    provider: Eurostat / national
    category: cost
    access: api
    auth: null
    refresh_interval_hours: 168
    geo_level: country
    coverage: EU/EEA
    license: attribution
    cost: free
    status: proposed
    indicators: [labour_cost_index, energy_price_index, hotel_margin_proxy]
    notes: Separates a RevPAR tailwind from an actual profit tailwind.

  # ============ 10. CAPITAL MARKETS ============
  - id: transactions
    name: Hotel transaction volume and yields
    provider: CoStar / RCA / MSCI
    category: capital
    access: api
    auth: null
    refresh_interval_hours: 720
    geo_level: market
    coverage: Europe, quarterly
    license: restricted
    cost: check entitlement
    status: proposed
    indicators: [transaction_volume, prime_yield, yield_shift]
    notes: Confirm whether the CoStar entitlement already covers this.
